  <style>
        :root {
          --bg-primary:    #0b0815;
      --bg-secondary:  #141028;
      --bg-card:       #1c1635;
      --bg-card-hover: #231d42;
      
      --accent-rose:    #c9a8ff;   /* primary lavender */
      --accent-blush:   #e6d6ff;   /* light lavender */
      --accent-lavender:#c9a8ff;   /* true lavender */
      --accent-mid:     #a87cff;   /* mid lavender */
      --accent-deep:    #7a4de8;   /* deep violet */
      --accent-primary: var(--accent-rose);

       --gradient-accent:       linear-gradient(135deg, #7a4de8 0%, #c9a8ff 100%);
      --gradient-accent-soft:  linear-gradient(135deg, #c9a8ff 0%, #e6d6ff 100%);
      --gradient-accent-hover: linear-gradient(135deg, #8f5ff0 0%, #d4b8ff 100%);
      --gradient-accent-deep:  linear-gradient(135deg, #5c35c0 0%, #7a4de8 100%);

      --text-primary:   #f0eeff;
      --text-secondary: #9b8fc0;
      --text-muted:     #4e4570;

      --gradient-hero:  radial-gradient(ellipse at 80% 30%, rgba(122, 77, 232, 0.18) 0%, transparent 55%),
                        radial-gradient(ellipse at 10% 80%, rgba(168, 124, 255, 0.12) 0%, transparent 50%),
                        radial-gradient(ellipse at 50% 5%,  rgba(201, 168, 255, 0.07) 0%, transparent 40%),
                        linear-gradient(180deg, #0b0815 0%, #110a20 100%);
      --gradient-stats: linear-gradient(135deg, #141028 0%, #1a1035 100%);
      --gradient-card:  linear-gradient(145deg, #1c1635, #231d42);

       --glow-accent:    0 0 40px rgba(201, 168, 255, 0.25);
      --glow-deep:      0 0 50px rgba(122, 77, 232, 0.3);
      --glow-soft:      0 0 25px rgba(201, 168, 255, 0.15);
      --shadow-card:    0 4px 32px rgba(0, 0, 0, 0.7);
      --shadow-hover:   0 12px 48px rgba(201, 168, 255, 0.2);

      --font-family:    'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;      
      --font-light:     300;
      --font-regular:   400;
      --font-semibold:  600;
      --font-bold:      700;

      --space-xs:  0.5rem;
      --space-sm:  1rem;
      --space-md:  2rem;
      --space-lg:  4rem;
      --space-xl:  6rem;
      
        --transition-fast:   0.3s ease;
      --transition-medium: 0.5s ease-out;
      --transition-slow:   0.8s ease-out;
      
      --radius-sm:  8px;
      --radius-md:  16px;
      --radius-lg:  24px;
      --radius-pill:9999px;

        }
   
    body.day-mode {
        --bg-primary : #f0ebff;
        --bg-secondary:  #e8e0ff;

      --accent-blush:   #9b6ff5;
      --accent-lavender:#7a4de8;
      --accent-mid:     #a87cff;
      --accent-deep:    #5c35c0;

      --gradient-accent:       linear-gradient(135deg, #5c35c0 0%, #a87cff 100%);
      --gradient-accent-soft:  linear-gradient(135deg, #7a4de8 0%, #c9a8ff 100%);
      --gradient-accent-hover: linear-gradient(135deg, #6b42d4 0%, #b48ef0 100%);

      --text-primary:   #1a0a3d;
      --text-secondary: #4a3070;
      --text-muted:     #8070a8;

      --gradient-hero:  radial-gradient(ellipse at 80% 30%, rgba(122, 77, 232, 0.15) 0%, transparent 55%),

                        linear-gradient(180deg, #f0ebff 0%, #e4d8ff 100%);

      --glow-accent:    0 0 30px rgba(122, 77, 232, 0.2);
      --glow-deep:      0 0 40px rgba(92, 53, 192, 0.2);
      --glow-soft:      0 0 20px rgba(122, 77, 232, 0.12);
      --shadow-card:    0 4px 24px rgba(122, 77, 232, 0.12);
      --shadow-hover:   0 12px 40px rgba(122, 77, 232, 0.2);
    }    
    
   body.day-mode .navbar{
    background: rgba(240, 235, 255, 0.88);
    border-bottom-color: rgba(122, 77, 232, 0.15);
   } 
     body.day-mode .nav-links a {
      color: var(--text-secondary);
    }

    body.day-mode .nav-links a:hover {
      color: var(--text-primary);
    }

    body.day-mode .hamburger span {
      background: var(--text-primary);
    }

    body.day-mode .about-section,
    body.day-mode .gallery-section {
      border-color: rgba(122, 77, 232, 0.1);
    }

    body.day-mode .stat-item {
      background: rgba(122, 77, 232, 0.05);

    }

    body.day-mode .form-group input,
    body.day-mode .form-group textarea {

    }

    body.day-mode .form-group input::placeholder,
    body.day-mode .form-group textarea::placeholder {
      color: var(--text-muted);
    }

    body.day-mode .contact-form,
    body.day-mode .contact-info,
    body.day-mode .about-text {
      background: rgba(255, 255, 255, 0.5);
      border-color: rgba(122, 77, 232, 0.15);
    }

    body.day-mode .video-card {
      border-color: rgba(122, 77, 232, 0.15);
    }

    body.day-mode .gallery-item {
      border-color: rgba(122, 77, 232, 0.15);
    }

    body.day-mode .footer {
      background: var(--bg-secondary);
      border-top-color: rgba(122, 77, 232, 0.15);
    }

    body.day-mode .section-title {
      background: linear-gradient(135deg, #1a0a3d 0%, #7a4de8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .theme-toggle {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        cursor: pointer;
        user-select: none;
    }

    .theme-toggle-icon{
        font-size: 0.85rem;
        color: var(--text-secondary);
        transition: var(--transition-fast);
        width: 16px;
        text-align: center;
    }

    .theme-toggle-track {
        position: relative;
        width: 44px;
        height: 24px;
        background: rgba(201, 168,255, 0.3);
        border-radius: var(--radius-pill);
        transition: var(--transition-fast);
        cursor: pointer;
    }

    .theme-toggle-track:hover {
        background: rgba(201, 168,255, 0.5);
    }

    .theme-toggle-thumb {
        position: absolute;
        top: 3px;
        left: 3px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: var(--gradient-accent);
        box-shadow: 0 0 8px rgba(122, 77,232,0.5);
        transition: transform 0.3s ease, background 0.3s ease;
      }

      body.day-mode .theme-toggle-thumb {
        transform: translateX(20px);
        background: var(--gradient-accent);
      }

      body.day-mode .theme-toggle-track {
        background: rgba(122, 77,232, 0.15);
        border-color: rgba(122, 77,232, 0.4);
      }

      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        }

        html { 
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-family);
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 2rem;
            background: rgba(11,8,21,0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(201,168,255,0.12);
            transition: var(--transition-fast);
        }

        .nav-band {
            font-family: 'Great Vibes', cursive;
            font-size: 1.8rem;
            font-weight: 400;
            background: linear-gradient(135deg, #c9a8ff 0%, #e6d6ff 100% );
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
            letter-spacing: 0.03em;
            filter: drop-shadow (0 0 8px rgba(201, 168,255,0.4));
            transition: var(--transition-fast);
        } 

        .nav-band:hover {
            filter: drop-shadow(0 0 14px rgba(201, 168,255,0.65));
        }

        .nav-links{
            display: flex;
            align-items: center;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: var(--font-regular);
            letter-spacing: 0.03rem;
            transition: var(--transition-fast);
            position: relative;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -4px;
            width: 0;
            height: 1px;
            background: var(--accent-rose);
            transition: var(--transition-fast);
        }

        .nav-links a:hover {
            color: var(--text-primary);
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .nav-cta {
            background: var(--gradient-accent) !important;
            color: #fff !important;
            padding: 0.5rem 1.5rem;
            border-radius: var(--radius-pill);
            font-weight: var(--font-semibold) !important;
            transition: var(--transition-fast) !important;
        }

        .nav-cta:hover {
            opacity: 0.9 !important;
            transform: translateY(-2px);
            box-shadow: 0 6px 28px rgba(122, 77, 232, 0.45), 0 0 0 1px rgba(201, 168, 255, 0.2) !important;
        }

        .nav-cta::after {
            display: none !important;
        }

        .hamburger{
            display: none;
            flex-direction: column;
            gap: 5px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
        }

        .hamburger span {
            display: block;
            width: 24px;
            height: 2px;
            background: var(--text-primary);
            border-radius: 2px;
            transition: var(--transition-fast);
        }

      @media (max-width: 767px) {
      .hamburger {
        display: flex;
      }

      .nav-links {
        position: absolute;
        top: 100%;
        left: 0;
        width: 100%;
        flex-direction: column;
        gap: 0;
        background: rgba(11, 8, 21, 0.97);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-bottom: 1px solid rgba(201, 168, 255, 0.12);
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.4s ease;
      }
  
            .nav-links.open {
        max-height: 400px;
      }

      .nav-links li {
        width: 100%;
      }

      .nav-links a {
        display: block;
        padding: 1rem 2rem;
        font-size: 1rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }

      .nav-cta {
        margin: 1rem 2rem;
        display: inline-block;
        text-align: center;
        border-radius: var(--radius-pill) !important;
      }
    }

    .hero {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--gradient-hero);
        position: relative;
        overflow: hidden;
        padding: 6rem 2rem 2rem 4 rem;
    }

    .hero-bg {
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        animation: orbPulse 6s ease-in-out infinite alternate;
    }

    .hero-orb-1 {
        width: 650px;
        height: 650px;
      background: radial-gradient(circle, rgba(122, 77, 232, 0.2) 0%, transparent 70%);
        top: -180px;
        right: -180px;
        animation-delay: 0s;
    }

    .hero-orb-2 {
        width: 550px;
        height: 550px;
      background: radial-gradient(circle, rgba(201, 168, 255, 0.14) 0%, transparent 70%);
        bottom: -120px;
        left: -120px;
        animation-delay: -3s;
    }

    @keyframes orbPlus {
        0% {
            opacity: 0.3; transform: scale(1);
        }
        100% {
            opacity: 0.6; transform: scale(1.1);
        }
    }

    .hero-content {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        gap: 4rem;
        max-width: 1000px;
        width: 100%;
    }

    .hero-image-wrapper{
        flex-shrink: 0;
        position: relative;
    }
    
    .hero-photo-orb{
        position: absolute;
        width: 320px;
        height: 320px;
        border-radius: 50%;
        background: radial-gradient(circle at 45% 42%,
        rgba(230, 214, 255, 0.95) 0%,
        rgba(201, 168, 255, 0.85) 20%,
        rgba(168, 124, 255, 0.65) 45%,
        rgba(122, 77, 232, 0.35) 70%,
        transparent 100%
         );
      filter: blur(28px);
      opacity: 0.42;
      pointer-events: none;
      z-index: 0;
      bottom: -40px;
      right: -50px;
      animation: orbGlow 6s ease-in-out infinite alternate;
      }

      @keyframes orbflow {
         0%   { opacity: 0.35; transform: scale(1); }
      100% { opacity: 0.5;  transform: scale(1.08); } 
      }

      .hero-image-placeholder {
        position: relative;
        z-index: 1;
      }
 
      @media (max-width: 767px ) {
        .hero-photo-orb{
            width: 220px;
            height: 220px;
            bottom: -25px;
            right: -30px;
            filter: blur(20px);
        }
      }

      .hero-image-placeholder{
         width: 220px;
      height: 220px;
      border-radius: 50%;
      background: linear-gradient(145deg, #1c1635, #2a1a50);

                  0 0 60px rgba(201, 168, 255, 0.25),

      .hero-initials {
        font-size: 3rem;
        font-weight: var(--font-bold);
        background: var(--gradient-accent);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;

        user-select: none;
      }

      .hero-text{
        flex: 1;

      .hero-subtitle {
        font-size: 0.85rem;

        text-transform: uppercase;

      .hero-name {
        line-height: 1.1;

        flex-direction: column;
        gap: 0.1rem;
      }
  
         .hero-name-script {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(3.5rem, 8vw, 6rem);
      font-weight: 400;
      background: linear-gradient(135deg, #c9a8ff 0%, #e6d6ff 60%, #c9a8ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 0.03em;
      line-height: 1.15;
      text-shadow: none;
      filter: drop-shadow(0 0 12px rgba(201, 168, 255, 0.55))
              drop-shadow(0 0 28px rgba(122, 77, 232, 0.35));
      animation: nameReveal 1.0s ease-out both;
    }

    .hero-name-last {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(2.5rem, 5.5vw, 4.2rem);
      font-weight: 400;
      background: linear-gradient(135deg, #c9a8ff 0%, #e6d6ff 60%, #c9a8ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 0.03em;
      line-height: 1.15;
      text-transform: none;
      filter: drop-shadow(0 0 10px rgba(201, 168, 255, 0.45))
              drop-shadow(0 0 22px rgba(122, 77, 232, 0.28));
      animation: nameReveal 1.0s ease-out 0.2s both;
    }

    @keyframes nameReveal {
      0% {
        opacity: 0;
        transform: translateY(18px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .hero-tagline {
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      font-weight: var(--font-light);
      color: var(--text-secondary);
      margin-bottom: 1.5rem;
      letter-spacing: 0.02em;
    }

    .hero-social{
        display: flex;
        gap: 1rem;
        margin-bottom: 2rem;
    }

    .hero-social a {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: rgba(201, 168, 255, 0.08);
      border: 1px solid rgba(201, 168, 255, 0.28);

      font-size: 1.1rem;
      text-decoration: none;

    .hero-social a:hover {
        background: var(--gradient-accent);
       border-color: transparent;

    .hero-action {
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
    }

    .btn {
        display: inline-block;
        align-items: center;
        gap: 0.5rem;
        padding: 0.85rem 2rem;
        border-radius: var(--radius-pill);
        font-family: var(--font-family);
        font-weight: var(--font-semibold);
        text-decoration: none;
        cursor: pointer;
        border: none;
        transition: var(--transition-fast);
        letter-spacing: 0.02em;
    }

    .btn-primary {
        background: var(--gradient-accent);
        color: #fff;
        border: none;
        box-shadow: 0 4px 20px rgba(122, 77, 232, 0.35);
    }

    .btn-primary:hover {
      background: var(--gradient-accent-hover);
      transform: translateY(-3px);

    }
     
    .btn-outline {

    .btn-outline:hover {
      background: rgba(201, 168, 255, 0.08);
      border-color: rgba(201, 168, 255, 0.7);
      transform: translateY(-3px);
      box-shadow: 0 8px 32px rgba(201, 168, 255, 0.25), 0 0 0 1px rgba(201, 168, 255, 0.15);

    .scroll-dot {
      width: 6px;

      animation: scrollBounce 2s ease-in-out infinite;
    }

    @keyframes scrollBounce {
        0%, 100% { transform: translateY(0); opacity: 1; }

    .section-cta{
      text-align: center;
      margin-top: 3rem;
    }

    .about-section{
      background: var(--bg-secondary);
      border-top: 1px solid rgba(201, 168, 255, 0.07);
      border-bottom: 1px solid rgba(201, 168, 255, 0.07);
      position: relative;
      overflow: hidden;
    }
    

    .videos-section{
      background: var(--bg-primary);
      position:relative;
      overflow: hidden;
    }

    .gallery-section{
      background: var(--bg-secondary);
      border-top: 1px solid rgba(201, 168, 255, 0.07);
      border-bottom: 1px solid rgba(201, 168, 255, 0.07);
      position:relative;
      overflow:hidden; 
    }

    .contact-section{
      background: var(--bg-primary);
      position:relative;
      overflow: hidden;
    }

    .video-grid{
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: var(--space-md);
    }

    .video-card{
      cursor: pointer;
      border-radius: var(--radius-md);
      overflow: hidden;
      transition: var(--transition-fast);
      border: 1px solid rgba(201, 168, 255, 0.1);
      background: rgba(255, 255, 255, 0.02); ;
    }

    .video-card:hover{
      transform: scale(1.04);
      border-color: rgba(201, 168, 255, 0.3);
      box-shadow: 0 16px 48px rgba(201, 168, 255, 0.2), 0 0 0 1px rgba(201, 168, 255, 0.15);
    }

    .video-placeholder{
      aspect-ratio: 9/16;
      position: relative;
      border-radius: var(--radius-md);
      overflow: hidden;
      background: var(--bg-card);
    }

    .video-thumb-bg{
      position:absolute;
      inset: 0;
      transition: transform 0.4s ease;
    }

    .video-thumb-1 { background: linear-gradient(160deg, #0f0820 0%, #2a1060 50%, #120f22 100%); }
    .video-thumb-2 { background: linear-gradient(160deg, #120820 0%, #3a1570 50%, #120f22 100%); }
    .video-thumb-3 { background: linear-gradient(160deg, #0a0820 0%, #1e0f50 50%, #120f22 100%); }
    .video-thumb-4 { background: linear-gradient(160deg, #150820 0%, #4a1880 50%, #120f22 100%); }
    .video-thumb-5 { background: linear-gradient(160deg, #0d0820 0%, #251265 50%, #120f22 100%); }
    .video-thumb-6 { background: linear-gradient(160deg, #100820 0%, #320f58 50%, #120f22 100%); }

    .play-icon{
      position: absolute;
      top: 50%;
      left: 50%;
       transform: translate(-50%, -50%);
      width: 52px;
      height: 52px;
      background: rgba(201, 168, 255, 0.12);
      border: 1px solid rgba(201, 168, 255, 0.45);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-lavender);
      font-size: 1.1rem;
      transition: var(--transition-fast);
      backdrop-filter: blur(8px);
    }

    .video-card:hover .play-icon{
      background: var(--gradient-accent);
      border-color: transparent;
      color: #fff;
      transform: translate(-50%, -50%) scale(1.1);
      box-shadow: 0 0 30px rgba(122, 77, 232, 0.5);
    }
    
    .video-label{
      position:absolute;
      bottom: 1rem;
      left: 0;
      right: 0;
      text-align: center;
      font-size:0.75rem;
      color: rgba(201, 168, 255, 0.7);
      font-weight: var(--font-light);
      letter-spacing: 0.03em;
    }

    .video-tag{
      position: absolute;
      bottom: 0.75rem;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.75rem;
      color: var(--accent-rose);
      font-weight: var(--font-semibold);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .about-image-wrapper{
      display: flex;
      justify-content: center;
      align-self: stretch;
    }


    .about-text{
      background: rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(201, 168, 255, 0.12);
      border-radius: var(--radius-lg);
      padding: 2.5rem;
    }
    
    .about-image-placeholder {
      width: 100%;
      height: 100%;
      min-height: 420px;
      border-radius: var(--radius-lg);
      background: linear-gradient(145deg, #1c1635, #231d42);
      border: 1px solid rgba(201, 168, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow-card),
                  0 0 60px rgba(122, 77, 232, 0.15),
                  0 0 0 1px rgba(201, 168, 255, 0.05);
      transition: var(--transition-fast);
    }

    .about-image-placeholder:hover {
      box-shadow: var(--shadow-card),
                  0 0 80px rgba(122, 77, 232, 0.25),
                  0 0 0 1px rgba(201, 168, 255, 0.15);
      border-color: rgba(201, 168, 255, 0.35);
    }

    .about-initials{
      font-size: 5rem;
      font-weight: var(--font-bold);
      background: var(--gradient-accent);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      opacity: 0.3;
      user-select: none;
    }

    .about-image-decoration {
      position: absolute;
      bottom: -20px;
      right: -20px;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(201, 168, 255, 0.3) 0%, transparent 70%);
      filter: blur(20px);
    }

    .about-divider{
      width: 40px;
      height: 2px;
      background: var(--gradient-accent);
      border-radius: 2px;
      margin: 1.25rem 0;
    }

    .about bio{
      color: var(--text-secondary);
      font-size: 1rem;
      line-height: 1.8;
      margin-bottom: 1rem;
      font-weight:var(--font-light);
    }

    .about-tag{
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 1.5rem;
    }

    about-tag {
      background: rgba(201, 168, 255, 0.08);
      border: 1px solid rgba(201, 168, 255, 0.22);
      color: var(--accent-lavender);
      padding: 0.35rem 0.85rem;
      border-radius: var(--radius-pill);
      font-size: 0.8rem;
      font-weight: var(--font-regular);
      transition: var(--transition-fast);
    }

    .about-tag:hover {
      background: rgba(201, 168, 255, 0.15);
      border-color: rgba(201, 168, 255, 0.4);
    }

    @media (max-width:767px){
      .about-content{
        grid-template-columns: 1fr;
        text-align: center;
      }

      .about-image-placeholder {
        width: 100%;
        height: 280px;
        min-height: 280px;
      }

      .about-divider {
        margin: 1.25rem auto;
      }

      .about-tags {
        justify-content: center;
      }
    }

    .stats-section {
      position: relative;
      overflow: hidden;
    }

    .stats-section::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(ellipse at center, rgba(122, 77, 232, 0.06) 0%, transparent 60%);
      pointer-events: none;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--space-md);
    }

    .stat-item {
      text-align: center;
      padding: 2.5rem 1.5rem;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(201, 168, 255, 0.15);
      border-radius: var(--radius-lg);
      transition: var(--transition-fast);
      position: relative;
      overflow: hidden;
    }

    .stat-item::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(122, 77, 232, 0.08) 0%, rgba(201, 168, 255, 0.05) 100%);
      opacity: 0;
      transition: var(--transition-fast);
    }

    .stat-item:hover::before {
      opacity: 1;
    }

    .stat-item:hover {
      border-color: rgba(201, 168, 255, 0.4);
      transform: translateY(-4px);
      box-shadow: 0 12px 48px rgba(201, 168, 255, 0.2), 0 0 0 1px rgba(201, 168, 255, 0.1);
    }

    .stat-icon-wrapper {
      margin-bottom: 1rem;
    }

    .stat-icon {
      font-size: 2rem;
      background: var(--gradient-accent);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .stat-value {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 0.1rem;
      margin-bottom: 0.5rem;
    }

    .stat-number {
      font-size: clamp(2.5rem, 5vw, 3.5rem);
      font-weight: var(--font-bold);
      color: var(--text-primary);
      line-height: 1;
    }

    .stat-unit {
      font-size: 1.5rem;
      font-weight: var(--font-semibold);
      background: var(--gradient-accent);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .stat-label {
      font-size: 0.85rem;
      color: var(--text-secondary);
      font-weight: var(--font-regular);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    @media (max-width: 767px) {
      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 480px) {
      .stats-grid {
        grid-template-columns: 1fr;
      }
    }

    /* =============================================
       GALLERY SECTION
       ============================================= */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: var(--space-sm);
    }

    .gallery-item {
      aspect-ratio: 1 / 1;
      overflow: hidden;
      border-radius: var(--radius-md);
      position: relative;
      cursor: pointer;
      border: 1px solid rgba(201, 168, 255, 0.1);
      transition: var(--transition-fast);
    }

    .gallery-item:hover {
      border-color: rgba(201, 168, 255, 0.35);
      box-shadow: 0 8px 32px rgba(201, 168, 255, 0.18);
    }

    .gallery-placeholder {
      width: 100%;
      height: 100%;
      transition: transform var(--transition-medium);
    }

    .gallery-item:hover .gallery-placeholder {
      transform: scale(1.1);
    }

    /* Unique gradient per gallery item */
    .gallery-ph-1 { background: linear-gradient(135deg, #0f0820 0%, #2a1060 100%); }
    .gallery-ph-2 { background: linear-gradient(135deg, #120820 0%, #3a1570 100%); }
    .gallery-ph-3 { background: linear-gradient(135deg, #0d0820 0%, #1e0f50 100%); }
    .gallery-ph-4 { background: linear-gradient(135deg, #150820 0%, #4a1880 100%); }
    .gallery-ph-5 { background: linear-gradient(135deg, #0a0820 0%, #251265 100%); }
    .gallery-ph-6 { background: linear-gradient(135deg, #100820 0%, #320f58 100%); }
    .gallery-ph-7 { background: linear-gradient(135deg, #0e0820 0%, #2d1268 100%); }
    .gallery-ph-8 { background: linear-gradient(135deg, #130820 0%, #3f1575 100%); }
    .gallery-ph-9 { background: linear-gradient(135deg, #0b0820 0%, #221060 100%); }

    .gallery-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(122, 77, 232, 0.55) 0%, rgba(201, 168, 255, 0.45) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity var(--transition-medium);
      color: #fff;
      font-size: 1.5rem;
    }

    .gallery-item:hover .gallery-overlay {
      opacity: 1;
    }

    @media (max-width: 767px) {
      .gallery-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    /* =============================================
       CONTACT SECTION
       ============================================= */
    .contact-wrapper {
      display: grid;
      grid-template-columns: 1fr 1.5fr;
      gap: var(--space-lg);
      align-items: start;
    }

    /* Contact info panel as a card */
    .contact-info {
      background: rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(201, 168, 255, 0.12);
      border-radius: var(--radius-lg);
      padding: 2rem;
    }

    .contact-info-title {
      font-size: 1.4rem;
      font-weight: var(--font-semibold);
      color: var(--text-primary);
      margin-bottom: 1rem;
    }

    .contact-info-text {
      color: var(--text-secondary);
      font-size: 0.95rem;
      line-height: 1.8;
      font-weight: var(--font-light);
      margin-bottom: 2rem;
    }

    .contact-details {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 2rem;
    }

    .contact-detail-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .contact-detail-item i {
      color: var(--accent-rose);
      width: 16px;
      text-align: center;
    }

    .contact-detail-item a {
      color: var(--accent-rose);
      text-decoration: none;
      transition: var(--transition-fast);
    }

    .contact-detail-item a:hover {
      color: var(--accent-blush);
    }

    .contact-social {
      display: flex;
      gap: 0.75rem;
    }

    .contact-social-link {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(201, 168, 255, 0.08);
      border: 1px solid rgba(201, 168, 255, 0.25);
      color: var(--accent-rose);
      font-size: 1rem;
      text-decoration: none;
      transition: var(--transition-fast);
    }

    .contact-social-link:hover {
      background: var(--gradient-accent);
      border-color: transparent;
      color: #fff;
      transform: translateY(-2px);
    }

    /* Form styles */
    .contact-form {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      background: rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(201, 168, 255, 0.12);
      border-radius: var(--radius-lg);
      padding: 2rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .form-group label {
      font-size: 0.85rem;
      font-weight: var(--font-semibold);
      color: var(--text-secondary);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .form-group input,
    .form-group textarea {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(201, 168, 255, 0.15);
      border-radius: var(--radius-sm);
      padding: 0.85rem 1rem;
      color: var(--text-primary);
      font-family: var(--font-family);
      font-size: 0.95rem;
      font-weight: var(--font-light);
      transition: var(--transition-fast);
      outline: none;
      resize: vertical;
    }

    .form-group input::placeholder,
    .form-group textarea::placeholder {
      color: var(--text-muted);
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: var(--accent-rose);
      box-shadow: 0 0 0 3px rgba(201, 168, 255, 0.15);
    }

    .form-group input.error,
    .form-group textarea.error {
      border-color: #c9a060;
    }

    .field-error {
      font-size: 0.8rem;
      color: #c9a060;
      display: none;
      margin-top: 0.2rem;
    }

    .field-error.visible {
      display: block;
    }

    .form-success {
      background: rgba(201, 168, 255, 0.08);
      border: 1px solid rgba(201, 168, 255, 0.3);
      border-radius: var(--radius-sm);
      padding: 1rem;
      color: var(--accent-lavender);
      font-size: 0.9rem;
      text-align: center;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .form-success:not([hidden]) {
      display: flex;
    }

    /* Error message — mirrors success style with a warm amber tint */
    .form-error {
      background: rgba(201, 160, 96, 0.08);
      border: 1px solid rgba(201, 160, 96, 0.35);
      border-radius: var(--radius-sm);
      padding: 1rem;
      color: #c9a060;
      font-size: 0.9rem;
      text-align: center;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .form-error:not([hidden]) {
      display: flex;
    }

    @media (max-width: 767px) {
      .contact-wrapper {
        grid-template-columns: 1fr;
      }
    }

    /* =============================================
       FOOTER
       ============================================= */
    .footer {
      background: var(--bg-secondary);
      border-top: 1px solid rgba(201, 168, 255, 0.12);
      padding: 3rem 2rem;
      box-shadow: 0 -4px 40px rgba(122, 77, 232, 0.08);
      position: relative;
      overflow: hidden;
    }

    .footer-content {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      text-align: center;
    }

    .footer-name {
      font-size: 1.2rem;
      font-weight: var(--font-semibold);
      background: var(--gradient-accent);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      display: block;
      margin-bottom: 0.25rem;
    }

    .footer-tagline {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: var(--font-light);
    }

    .footer-social {
      display: flex;
      gap: 1rem;
    }

    .footer-social-link {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(201, 168, 255, 0.06);
      border: 1px solid rgba(201, 168, 255, 0.18);
      color: var(--text-secondary);
      font-size: 1rem;
      text-decoration: none;
      transition: var(--transition-fast);
    }

    .footer-social-link:hover {
      background: var(--gradient-accent);
      border-color: transparent;
      color: #fff;
      transform: translateY(-2px);
    }

    .footer-copy {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: var(--font-light);
    }

    /* =============================================
       BACK TO TOP BUTTON
       ============================================= */
    .back-to-top {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      z-index: 999;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: var(--gradient-accent);
      color: #fff;
      border: 1px solid rgba(201, 168, 255, 0.3);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      opacity: 0;
      pointer-events: none;
      transform: translateY(20px);
      transition: var(--transition-fast);
      box-shadow: 0 4px 20px rgba(122, 77, 232, 0.4);
    }

    .back-to-top.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .back-to-top:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 36px rgba(122, 77, 232, 0.6), 0 0 0 1px rgba(201, 168, 255, 0.3);
    }

    /* =============================================
       SCROLL ANIMATIONS (Intersection Observer)
       ============================================= */
    .animate-on-scroll {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity var(--transition-slow), transform var(--transition-slow);
    }

    .animate-on-scroll.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Focus visible styles for accessibility */
    :focus-visible {
      outline: 2px solid var(--accent-lavender);
      outline-offset: 3px;
      border-radius: 4px;
      box-shadow: 0 0 12px rgba(201, 168, 255, 0.3);
    }

    /* Skip to content link (keyboard accessibility) */
    .skip-link {
      position: absolute;
      top: -100%;
      left: 1rem;
      background: var(--gradient-accent);
      color: #fff;
      padding: 0.5rem 1rem;
      border-radius: var(--radius-sm);
      font-weight: var(--font-semibold);
      font-size: 0.9rem;
      text-decoration: none;
      z-index: 9999;
      transition: top 0.2s ease;
    }

    .skip-link:focus {
      top: 1rem;
    }

    /* Tablet breakpoint for videos grid */
    @media (min-width: 768px) and (max-width: 1023px) {
      .videos-grid {
        grid-template-columns: repeat(3, 1fr);
      }

      .gallery-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    /* =============================================
       DECORATIVE ELEMENTS — Glowing Orbs & Leaves
       ============================================= */

    /* Global decorative wrapper */
    .deco-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    /* ---- Glowing orbs ---- */
    .glow-orb {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(80px);
    }

    /* Hero orbs */
    .glow-orb--hero-tl {
      width: 400px;
      height: 400px;
      top: -80px;
      left: -80px;
      background: radial-gradient(circle, rgba(122, 77, 232, 0.2) 0%, transparent 70%);
      animation: orbFloat 8s ease-in-out infinite alternate;
    }

    .glow-orb--hero-br {
      width: 300px;
      height: 300px;
      bottom: 0;
      right: 5%;
      background: radial-gradient(circle, rgba(201, 168, 255, 0.18) 0%, transparent 70%);
      animation: orbFloat 10s ease-in-out infinite alternate-reverse;
    }

    /* Gallery orb */
    .glow-orb--gallery-l {
      width: 350px;
      height: 350px;
      top: 20%;
      left: -100px;
      background: radial-gradient(circle, rgba(122, 77, 232, 0.15) 0%, transparent 70%);
      filter: blur(90px);
      animation: orbFloat 12s ease-in-out infinite alternate;
    }

    /* Contact orb */
    .glow-orb--contact-r {
      width: 320px;
      height: 320px;
      top: 10%;
      right: -80px;
      background: radial-gradient(circle, rgba(201, 168, 255, 0.2) 0%, transparent 70%);
      filter: blur(100px);
      animation: orbFloat 9s ease-in-out infinite alternate-reverse;
    }

    /* Stats orb */
    .glow-orb--stats-c {
      width: 500px;
      height: 200px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
