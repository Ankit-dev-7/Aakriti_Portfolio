  <style>
        :root {
          --bg-primary:    #0b0815;
      --bg-secondary:  #141028;
      --bg-card:       #1c1635;
      --bg-card-hover: #231d42;
      
      --accent-rose:    #c9a8ff;   /* primary lavender */
      --accent-blush:   #e6d6ff;   /* light lavender */
      --accent-lavender:#c9a8ff;   /* true lavender */
      --accent-mid:     #a87cff;   /* mid lavender */
      --accent-deep:    #7a4de8;   /* deep violet */
      --accent-primary: var(--accent-rose);

       --gradient-accent:       linear-gradient(135deg, #7a4de8 0%, #c9a8ff 100%);
      --gradient-accent-soft:  linear-gradient(135deg, #c9a8ff 0%, #e6d6ff 100%);
      --gradient-accent-hover: linear-gradient(135deg, #8f5ff0 0%, #d4b8ff 100%);
      --gradient-accent-deep:  linear-gradient(135deg, #5c35c0 0%, #7a4de8 100%);

      --text-primary:   #f0eeff;
      --text-secondary: #9b8fc0;
      --text-muted:     #4e4570;

      --gradient-hero:  radial-gradient(ellipse at 80% 30%, rgba(122, 77, 232, 0.18) 0%, transparent 55%),
                        radial-gradient(ellipse at 10% 80%, rgba(168, 124, 255, 0.12) 0%, transparent 50%),
                        radial-gradient(ellipse at 50% 5%,  rgba(201, 168, 255, 0.07) 0%, transparent 40%),
                        linear-gradient(180deg, #0b0815 0%, #110a20 100%);
      --gradient-stats: linear-gradient(135deg, #141028 0%, #1a1035 100%);
      --gradient-card:  linear-gradient(145deg, #1c1635, #231d42);

       --glow-accent:    0 0 40px rgba(201, 168, 255, 0.25);
      --glow-deep:      0 0 50px rgba(122, 77, 232, 0.3);
      --glow-soft:      0 0 25px rgba(201, 168, 255, 0.15);
      --shadow-card:    0 4px 32px rgba(0, 0, 0, 0.7);
      --shadow-hover:   0 12px 48px rgba(201, 168, 255, 0.2);

      --font-family:    'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;      
      --font-light:     300;
      --font-regular:   400;
      --font-semibold:  600;
      --font-bold:      700;

      --space-xs:  0.5rem;
      --space-sm:  1rem;
      --space-md:  2rem;
      --space-lg:  4rem;
      --space-xl:  6rem;
      
        --transition-fast:   0.3s ease;
      --transition-medium: 0.5s ease-out;
      --transition-slow:   0.8s ease-out;
      
      --radius-sm:  8px;
      --radius-md:  16px;
      --radius-lg:  24px;
      --radius-pill:9999px;

        }
   
    body.day-mode {
        --bg-primary : #f0ebff;
        --bg-secondary:  #e8e0ff;
      --bg-card:       #ddd4ff;
      --bg-card-hover: #d0c4ff;

      --accent-rose:    #7a4de8;
      --accent-blush:   #9b6ff5;
      --accent-lavender:#7a4de8;
      --accent-mid:     #a87cff;
      --accent-deep:    #5c35c0;

      --gradient-accent:       linear-gradient(135deg, #5c35c0 0%, #a87cff 100%);
      --gradient-accent-soft:  linear-gradient(135deg, #7a4de8 0%, #c9a8ff 100%);
      --gradient-accent-hover: linear-gradient(135deg, #6b42d4 0%, #b48ef0 100%);

      --text-primary:   #1a0a3d;
      --text-secondary: #4a3070;
      --text-muted:     #8070a8;

      --gradient-hero:  radial-gradient(ellipse at 80% 30%, rgba(122, 77, 232, 0.15) 0%, transparent 55%),
                        radial-gradient(ellipse at 10% 80%, rgba(168, 124, 255, 0.1) 0%, transparent 50%),
                        linear-gradient(180deg, #f0ebff 0%, #e4d8ff 100%);
      --gradient-stats: linear-gradient(135deg, #e8e0ff 0%, #ddd4ff 100%);
      --gradient-card:  linear-gradient(145deg, #ddd4ff, #d0c4ff);

      --glow-accent:    0 0 30px rgba(122, 77, 232, 0.2);
      --glow-deep:      0 0 40px rgba(92, 53, 192, 0.2);
      --glow-soft:      0 0 20px rgba(122, 77, 232, 0.12);
      --shadow-card:    0 4px 24px rgba(122, 77, 232, 0.12);
      --shadow-hover:   0 12px 40px rgba(122, 77, 232, 0.2);
    }    
    
   body.day-mode .navbar{
    background: rgba(240, 235, 255, 0.88);
    border-bottom-color: rgba(122, 77, 232, 0.15);
   } 
     body.day-mode .nav-links a {
      color: var(--text-secondary);
    }

    body.day-mode .nav-links a:hover {
      color: var(--text-primary);
    }

    body.day-mode .hamburger span {
      background: var(--text-primary);
    }

    body.day-mode .about-section,
    body.day-mode .gallery-section {
      border-color: rgba(122, 77, 232, 0.1);
    }

    body.day-mode .stat-item {
      background: rgba(122, 77, 232, 0.05);
      border-color: rgba(122, 77, 232, 0.15);
    }

    body.day-mode .form-group input,
    body.day-mode .form-group textarea {
      background: rgba(255, 255, 255, 0.7);
      border-color: rgba(122, 77, 232, 0.2);
      color: var(--text-primary);
    }

    body.day-mode .form-group input::placeholder,
    body.day-mode .form-group textarea::placeholder {
      color: var(--text-muted);
    }

    body.day-mode .contact-form,
    body.day-mode .contact-info,
    body.day-mode .about-text {
      background: rgba(255, 255, 255, 0.5);
      border-color: rgba(122, 77, 232, 0.15);
    }

    body.day-mode .video-card {
      border-color: rgba(122, 77, 232, 0.15);
    }

    body.day-mode .gallery-item {
      border-color: rgba(122, 77, 232, 0.15);
    }

    body.day-mode .footer {
      background: var(--bg-secondary);
      border-top-color: rgba(122, 77, 232, 0.15);
    }

    body.day-mode .section-title {
      background: linear-gradient(135deg, #1a0a3d 0%, #7a4de8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .theme-toggle {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        cursor: pointer;
        user-select: none;
    }

    .theme-toggle-icon{
        font-size: 0.85rem;
        color: var(--text-secondary);
        transition: var(--transition-fast);
        width: 16px;
        text-align: center;
    }

    .theme-toggle-track {
        position: relative;
        width: 44px;
        height: 24px;
        background: rgba(201, 168,255, 0.3);
        border-radius: var(--radius-pill);
        transition: var(--transition-fast);
        cursor: pointer;
    }

    .theme-toggle-track:hover {
        background: rgba(201, 168,255, 0.5);
    }

    .theme-toggle-thumb {
        position: absolute;
        top: 3px;
        left: 3px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: var(--gradient-accent);
        box-shadow: 0 0 8px rgba(122, 77,232,0.5);
        transition: transform 0.3s ease, background 0.3s ease;
      }

      body.day-mode .theme-toggle-thumb {
        transform: translateX(20px);
        background: var(--gradient-accent);
      }

      body.day-mode .theme-toggle-track {
        background: rgba(122, 77,232, 0.15);
        border-color: rgba(122, 77,232, 0.4);
      }

      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        }

        html { 
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-family);
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 2rem;
            background: rgba(11,8,21,0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(201,168,255,0.12);
            transition: var(--transition-fast);
        }

        .nav-band {
            font-family: 'Great Vibes', cursive;
            font-size: 1.8rem;
            font-weight: 400;
            background: linear-gradient(135deg, #c9a8ff 0%, #e6d6ff 100% );
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
            letter-spacing: 0.03em;
            filter: drop-shadow (0 0 8px rgba(201, 168,255,0.4));
            transition: var(--transition-fast);
        } 

        .nav-band:hover {
            filter: drop-shadow(0 0 14px rgba(201, 168,255,0.65));
        }

        .nav-links{
            display: flex;
            align-items: center;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: var(--font-regular);
            letter-spacing: 0.03rem;
            transition: var(--transition-fast);
            position: relative;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -4px;
            width: 0;
            height: 1px;
            background: var(--accent-rose);
            transition: var(--transition-fast);
        }

        .nav-links a:hover {
            color: var(--text-primary);
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .nav-cta {
            background: var(--gradient-accent) !important;
            color: #fff !important;
            padding: 0.5rem 1.5rem;
            border-radius: var(--radius-pill);
            font-weight: var(--font-semibold) !important;
            transition: var(--transition-fast) !important;
        }

        .nav-cta:hover {
            opacity: 0.9 !important;
            transform: translateY(-2px);
            box-shadow: 0 6px 28px rgba(122, 77, 232, 0.45), 0 0 0 1px rgba(201, 168, 255, 0.2) !important;
        }

        .nav-cta::after {
            display: none !important;
        }

        .hamburger{
            display: none;
            flex-direction: column;
            gap: 5px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
        }
